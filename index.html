<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Avanço Semanal</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  :root {
    --green: #2ecc40;
    --green-dark: #27ae60;
    --orange: #e87722;
    --orange-dark: #d4660a;
    --teal: #1a9bb5;
    --teal-dark: #157a90;
    --olive: #6b8c3e;
    --red: #e74c3c;
    --yellow: #f1c40f;
    --gray-light: #f0f0f0;
    --gray-mid: #ccc;
    --text-dark: #1a1a1a;
    --white: #ffffff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Barlow', sans-serif;
    background: #e8e8e8;
    min-height: 100vh;
    padding: 12px 20px;
  }

  h1.page-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 2rem;
    font-weight: 900;
    text-align: center;
    color: #333;
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 2px;
  }

  .title-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-bottom: 12px;
  }
  .title-row h1.page-title {
    margin-bottom: 0;
  }
  .semana-badge {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1.6rem;
    font-weight: 900;
    color: #fff;
    background: #2c3e50;
    padding: 4px 14px;
    border-radius: 6px;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: default;
  }
  body.edit-mode .semana-badge {
    outline: 2px dashed var(--teal);
    background: rgba(26,155,181,0.12);
    color: #1a9bb5;
    cursor: text;
  }

  .toolbar {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }

  .btn {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 10px 20px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.18s ease;
  }

  .btn-edit   { background: var(--teal); color: #fff; }
  .btn-save   { background: var(--green-dark); color: #fff; }
  .btn-print  { background: #555; color: #fff; }
  .btn-login  { background: #2c3e50; color: #fff; }
  .btn-logout { background: #95a5a6; color: #fff; }
  .btn:hover  { opacity: 0.85; transform: translateY(-1px); }
  .btn:disabled { opacity: 0.6; cursor: default; transform: none; }

  /* ── LOADING ── */
  .loading-state {
    text-align: center;
    padding: 60px 20px;
    color: #666;
    font-size: 1rem;
    letter-spacing: 0.5px;
  }

  /* ── MODAL ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 1000;
    align-items: center;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }

  .modal-box {
    background: #fff;
    border-radius: 12px;
    padding: 32px 28px;
    width: 340px;
    max-width: 90vw;
    box-shadow: 0 8px 40px rgba(0,0,0,0.25);
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .modal-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1.6rem;
    font-weight: 900;
    text-align: center;
    color: #333;
    margin-bottom: 4px;
  }

  .modal-input {
    width: 100%;
    padding: 10px 14px;
    border: 1.5px solid #ccc;
    border-radius: 6px;
    font-family: 'Barlow', sans-serif;
    font-size: 0.95rem;
    outline: none;
    transition: border 0.15s;
  }
  .modal-input:focus { border-color: var(--teal); }

  .modal-actions { display: flex; gap: 10px; }
  .modal-actions .btn { flex: 1; }

  .login-error {
    color: var(--red);
    font-size: 0.82rem;
    text-align: center;
    min-height: 1.2em;
  }

  .cards-grid {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
    max-width: 1300px;
    margin: 0 auto;
  }

  .cards-grid .card {
    flex: 1 1 300px;
    max-width: 420px;
  }

  @media (max-width: 900px) { .cards-grid .card { max-width: 100%; } }

  /* ── CARD ── */
  .card {
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(0,0,0,0.18);
    background: #fff;
    display: flex;
    flex-direction: column;
  }

  .card-header {
    padding: 10px 18px 8px;
    color: #fff;
  }
  .card-header.teal   { background: var(--teal); }
  .card-header.orange { background: var(--orange); }
  .card-header.olive  { background: var(--olive); }

  .card-header .category {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 2rem;
    font-weight: 900;
    text-transform: uppercase;
    line-height: 1;
  }

  .card-header .avanço-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1.05rem;
    font-weight: 700;
    text-transform: uppercase;
    opacity: 0.95;
    white-space: nowrap;
  }

  .card-banner {
    width: 100%;
    height: 130px;
    object-fit: cover;
    display: block;
  }

  .banner-placeholder {
    width: 100%;
    height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.4rem;
  }
  .banner-placeholder.teal   { background: linear-gradient(135deg,#1a9bb5 0%,#a8e063 100%); }
  .banner-placeholder.orange { background: linear-gradient(135deg,#e87722 0%,#f7c460 100%); }
  .banner-placeholder.olive  { background: linear-gradient(135deg,#6b8c3e 0%,#c8e6a0 100%); }

  .section-bar {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 1.1rem;
    text-transform: uppercase;
    color: #fff;
    padding: 8px 16px;
    letter-spacing: 1px;
  }
  .section-bar.teal   { background: var(--teal); }
  .section-bar.orange { background: var(--orange); }
  .section-bar.olive  { background: var(--olive); }

  .sub-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 1rem;
    text-transform: uppercase;
    padding: 10px 16px 4px;
    color: #333;
    letter-spacing: 0.5px;
  }

  /* ── ACTIVITY ROW ── */
  .activities { padding: 6px 14px; flex: 1; }

  .activity {
    display: grid;
    grid-template-columns: 32px 1fr auto;
    align-items: center;
    gap: 8px;
    padding: 7px 0;
    border-bottom: 1px solid #f0f0f0;
  }
  .activity:last-child { border-bottom: none; }

  .act-icon { font-size: 1.5rem; text-align: center; position: relative; }
  body.edit-mode .act-icon[data-act] { cursor: pointer; outline: 2px dashed var(--teal); border-radius: 4px; }
  #actEmojiPopup { position: fixed; }
  .act-info { display: flex; flex-direction: column; gap: 3px; }

  .act-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #222;
  }

  .progress-wrap {
    position: relative;
    height: 16px;
    background: #e0e0e0;
    border-radius: 8px;
    overflow: hidden;
    margin-top: 1px;
  }

  .progress-bar {
    height: 100%;
    border-radius: 8px;
    transition: width 0.4s ease;
  }

  .progress-label {
    position: absolute;
    right: 6px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 0.65rem;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 1px 2px rgba(0,0,0,0.4);
    pointer-events: none;
  }

  .act-pct {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 0.85rem;
    text-align: right;
    min-width: 50px;
    color: #333;
  }

  /* META BOX */
  .meta-box {
    background: #f5f5f5;
    margin: 4px 14px 8px;
    border-radius: 6px;
    padding: 8px 12px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2px 12px;
    font-size: 0.78rem;
    color: #444;
  }
  .meta-box strong { color: #111; }
  .meta-total {
    grid-column: 1/-1;
    font-weight: 700;
    font-size: 0.82rem;
    color: #111;
    border-top: 1px solid #ddd;
    margin-top: 4px;
    padding-top: 4px;
  }

  /* MESSAGE BOX */
  .msg-box {
    margin: 0 14px 14px;
    background: #fff;
    border: 1.5px solid #ddd;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 0.82rem;
    color: #333;
    line-height: 1.45;
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }
  .msg-icon { font-size: 1.4rem; flex-shrink: 0; }

  /* ── EDITABLE OVERLAY ── */
  body.edit-mode [contenteditable] {
    outline: 2px dashed var(--teal);
    border-radius: 3px;
    background: rgba(26,155,181,0.06);
    cursor: text;
    min-width: 20px;
    display: inline-block;
  }

  body.edit-mode input[type="number"].meta-input {
    border: 2px solid var(--teal);
  }

  .meta-input {
    width: 50px;
    border: 1px solid transparent;
    border-radius: 4px;
    font-family: 'Barlow', sans-serif;
    font-size: 0.78rem;
    font-weight: 600;
    background: transparent;
    padding: 1px 2px;
    text-align: center;
    transition: border 0.15s;
  }

  body:not(.edit-mode) .meta-input { pointer-events: none; }

  .act-vals-edit { display: none; }
  .val-input {
    width: 42px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-family: 'Barlow', sans-serif;
    font-size: 0.85rem;
    padding: 1px 4px;
    text-align: center;
  }
  body.edit-mode .act-vals-view { display: none; }
  body.edit-mode .act-vals-edit { display: flex; gap: 4px; align-items: center; }


  /* ── DIAS BOX ── */
  .dias-box {
    display: none;
    position: fixed;
    top: 16px;
    right: 20px;
    background: #2c3e50;
    border-radius: 8px;
    padding: 8px 14px;
    z-index: 100;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  body.edit-mode .dias-box { display: flex; }
  .dias-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.75rem;
    font-weight: 700;
    color: #aaa;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .dias-inputs { display: flex; align-items: center; gap: 6px; }
  .dias-input {
    width: 44px;
    padding: 4px;
    border: 2px solid var(--teal);
    border-radius: 5px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1.2rem;
    font-weight: 800;
    text-align: center;
    background: #1a252f;
    color: #fff;
  }
  .dias-sep {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1.4rem;
    font-weight: 900;
    color: #fff;
  }

  /* Visibilidade */
  .card.card-hidden { opacity: 0.35; }
  .card-hidden-label {
    display: none;
    position: absolute;
    top: 8px; left: 8px;
    background: rgba(0,0,0,0.55);
    color: #fff;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.75rem;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 4px;
    text-transform: uppercase;
    pointer-events: none;
    z-index: 2;
  }
  .card { position: relative; }
  body.edit-mode .card-hidden-label { display: block; }

  /* Toggle visibilidade */
  .visibility-toggle {
    display: none;
    position: absolute;
    top: 8px; right: 8px;
    z-index: 10;
    align-items: center;
    gap: 6px;
    background: rgba(0,0,0,0.45);
    border-radius: 6px;
    padding: 4px 8px;
    cursor: pointer;
  }
  body.edit-mode .visibility-toggle { display: flex; }
  .visibility-toggle input { width: 16px; height: 16px; cursor: pointer; accent-color: var(--teal); }
  .visibility-toggle span {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.78rem;
    font-weight: 700;
    color: #fff;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  /* Color pickers */
  .card-color-row {
    display: none;
    gap: 10px;
    align-items: center;
    padding: 6px 14px;
    background: #f0f0f0;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.82rem;
    font-weight: 700;
    text-transform: uppercase;
    color: #555;
  }
  body.edit-mode .card-color-row { display: flex; }
  .card-color-row input[type="color"] {
    width: 32px; height: 32px;
    border: none; border-radius: 6px;
    cursor: pointer; padding: 0;
    background: none;
  }

  /* Emoji picker */
  .emoji-btn {
    display: none;
    position: absolute;
    bottom: 6px; right: 6px;
    background: rgba(0,0,0,0.45);
    border: none;
    border-radius: 6px;
    padding: 3px 7px;
    cursor: pointer;
    color: #fff;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    z-index: 5;
  }
  body.edit-mode .emoji-btn { display: block; }
  .banner-placeholder { position: relative; }

  .emoji-picker-popup {
    display: none;
    position: absolute;
    z-index: 200;
    background: #fff;
    border: 1.5px solid #ccc;
    border-radius: 10px;
    padding: 10px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.2);
    width: 260px;
    max-height: 220px;
    overflow-y: auto;
    flex-wrap: wrap;
    gap: 4px;
  }
  .emoji-picker-popup.open { display: flex; }
  .emoji-picker-popup button {
    font-size: 1.4rem;
    background: none;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    padding: 4px;
    transition: background 0.12s;
  }
  .emoji-picker-popup button:hover { background: #f0f0f0; }

  /* Adicionar / remover atividades */
  .act-remove-btn {
    display: none;
    background: var(--red);
    color: #fff;
    border: none;
    border-radius: 50%;
    width: 20px; height: 20px;
    font-size: 0.85rem;
    line-height: 1;
    cursor: pointer;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  body.edit-mode .act-remove-btn { display: flex; }

  .add-activity-btn {
    display: none;
    width: 100%;
    margin: 6px 0 4px;
    padding: 6px;
    background: none;
    border: 2px dashed #ccc;
    border-radius: 6px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.85rem;
    font-weight: 700;
    color: #999;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    transition: border-color 0.15s, color 0.15s;
  }
  .add-activity-btn:hover { border-color: var(--teal); color: var(--teal); }
  body.edit-mode .add-activity-btn { display: block; }

  /* Ghost card — novo card */
  .add-card-ghost {
    display: none;
    flex: 1 1 300px;
    max-width: 420px;
    min-height: 220px;
    border: 3px dashed #ccc;
    border-radius: 12px;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 10px;
    cursor: pointer;
    color: #bbb;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 1.1rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    background: #fafafa;
    transition: border-color 0.15s, color 0.15s;
  }
  .add-card-ghost:hover { border-color: var(--teal); color: var(--teal); }
  .add-card-ghost .ghost-plus { font-size: 2.5rem; line-height: 1; font-weight: 300; }
  body.edit-mode .add-card-ghost { display: flex; }

  /* New-card modal — campos de cor e emoji */
  .new-card-color-row {
    display: flex;
    gap: 20px;
    align-items: center;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 0.9rem;
    text-transform: uppercase;
    color: #555;
  }
  .new-card-color-row input[type="color"] {
    width: 36px; height: 36px;
    border: none; border-radius: 6px;
    cursor: pointer; padding: 0; background: none;
    margin-left: 6px;
  }
  #newCardEmojiBtn {
    font-size: 1.8rem;
    background: #f0f0f0;
    border: 1.5px solid #ccc;
    border-radius: 6px;
    cursor: pointer;
    padding: 2px 8px;
    line-height: 1.4;
    margin-left: 6px;
  }

  /* ── PRINT ── */
  @media print {
    .toolbar { display: none; }
    .modal-overlay { display: none !important; }
    body { background: #fff; padding: 0; }
    .card { box-shadow: none; border: 1px solid #ccc; break-inside: avoid; }
    .cards-grid { gap: 12px; }
    ._ph { display: none !important; }
  }
</style>
</head>
<body>

<div id="pdf-content">
<div class="title-row">
    <h1 class="page-title">📋 Avanço Semanal — Dashboard</h1>
    <span class="semana-badge" id="semanaBadge" contenteditable="false">S000</span>
  </div>

<div class="toolbar">
  <button class="btn btn-edit" id="toggleEdit" style="display:none">✏️ Editar Dados</button>
  <button class="btn btn-save" id="saveBtn" style="display:none">💾 Salvar</button>
  <button class="btn btn-login" id="loginBtn">🔐 Login</button>
  <button class="btn btn-logout" id="logoutBtn" style="display:none">🚪 Sair</button>
  <button class="btn btn-print" id="pdfBtn">📄 Gerar PDF</button>
</div>

<div id="loading" class="loading-state">Carregando dados...</div>

<div class="cards-grid" id="grid" style="display:none">
  <!-- Cards rendered by JS -->
</div>

  <div class="dias-box" id="diasBox">
    <label class="dias-label">DIA / DIAS DA SEMANA</label>
    <div class="dias-inputs">
      <input class="dias-input" type="number" id="diaAtual" min="1" max="7" value="1" title="Dia atual da semana">
      <span class="dias-sep">/</span>
      <input class="dias-input" type="number" id="diasSemana" min="1" max="7" value="5" title="Total de dias trabalhados na semana">
    </div>
  </div>

</div><!-- #pdf-content -->

<!-- Modal Novo Card -->
<div id="newCardModal" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-title">➕ Novo Card</div>
    <input type="text" id="newCardTitle" class="modal-input" placeholder="Título (ex: ESTRUTURA)" maxlength="40">
    <div class="new-card-color-row">
      COR 1: <input type="color" id="newCardColor1" value="#1a9bb5">
      COR 2: <input type="color" id="newCardColor2" value="#a8e063">
    </div>
    <div class="new-card-color-row">
      EMOJI: <button id="newCardEmojiBtn" type="button">🔧</button>
    </div>
    <div id="newCardError" class="login-error"></div>
    <div class="modal-actions">
      <button class="btn btn-save" id="newCardSubmit">Criar</button>
      <button class="btn btn-print" id="newCardCancel">Cancelar</button>
    </div>
  </div>
</div>

<!-- Modal de Login -->
<div id="loginModal" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-title">🔐 Login</div>
    <input type="email" id="loginEmail" class="modal-input" placeholder="Email" autocomplete="email">
    <input type="password" id="loginPassword" class="modal-input" placeholder="Senha" autocomplete="current-password">
    <div id="loginError" class="login-error"></div>
    <div class="modal-actions">
      <button class="btn btn-save" id="loginSubmit">Entrar</button>
      <button class="btn btn-print" id="loginCancel">Cancelar</button>
    </div>
  </div>
</div>

<script>
/* ════════════════════════════════════════════
   CONFIG SUPABASE
   Substitua pelos valores do seu projeto em:
   https://supabase.com → Project Settings → API
   // Tabela necessária: config (key TEXT PRIMARY KEY, value TEXT)
   // Tabelas necessárias — execute no SQL Editor do Supabase:
   //
   // CREATE TABLE emojis (
   //   id       SERIAL PRIMARY KEY,
   //   emoji    TEXT NOT NULL,
   //   position INT DEFAULT 0
   // );
   //
   // ALTER TABLE cards ADD COLUMN IF NOT EXISTS visible BOOLEAN DEFAULT true;
   // ALTER TABLE cards ADD COLUMN IF NOT EXISTS color1  TEXT DEFAULT '#1a9bb5';
   // ALTER TABLE cards ADD COLUMN IF NOT EXISTS color2  TEXT DEFAULT '#a8e063';
   //
   // Após criar a tabela, abra seed-emojis.html no browser para populá-la.
   // O arquivo seed-emojis.html é de uso único e não deve ser publicado.
════════════════════════════════════════════ */
const SUPABASE_URL = 'https://ilpijnuxkkyoyzccylzj.supabase.co';
const SUPABASE_KEY = 'sb_publishable__X0os9OU9nNEj9-xnX2-Cg_vLme29V4';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ════════════════════════════════════════════
   LOAD / SAVE  (Supabase)
════════════════════════════════════════════ */
async function loadData() {
  const { data: cardsRaw, error: cardsErr } = await sb
    .from('cards').select('*').order('sort_order');
  if (cardsErr) throw cardsErr;

  const { data: actsRaw, error: actsErr } = await sb
    .from('activities').select('*').order('position');
  if (actsErr) throw actsErr;

  const cards = cardsRaw.map(c => ({
    id:              c.id,
    theme:           c.theme,
    emoji:           c.emoji,
    title:           c.title,
    titleSub:        c.title_sub,
    subLabel:        c.sub_label,
    visible: c.visible !== false,
    color1:  c.color1 || '#1a9bb5',
    color2:  c.color2 || '#a8e063',
    message:         c.message,
    msgFooterLabel:  c.msg_footer_label,
    sortOrder:       c.sort_order,
    activities: actsRaw
      .filter(a => a.card_id === c.id)
      .map(a => ({
        id:        a.id,
        icon:      a.icon,
        name:      a.name,
        real:      Number(a.real_val),
        meta:      Number(a.meta),
        pct:       a.pct !== null ? Number(a.pct) : null,
        na:        a.na,
        isPercent: a.is_percent,
        position:  a.position,
      })),
  }));

  const { data: configRaw } = await sb
    .from('config').select('*').eq('key', 'semana_atual').single();
  const semanaVal = configRaw?.value || 'S000';

  const { data: diasRaw } = await sb
    .from('config').select('*').eq('key', 'dias_semana').single();
  const diasVal = diasRaw?.value || '1/5';

  document.getElementById('semanaBadge').textContent = semanaVal;
  const [diaA, diasS] = diasVal.split('/');
  document.getElementById('diaAtual').value = diaA || 1;
  document.getElementById('diasSemana').value = diasS || 5;

  return { cards };
}

async function saveData(data) {
  const semanaText = document.getElementById('semanaBadge').textContent.trim();
  const diaAtual   = document.getElementById('diaAtual').value;
  const diasSemana = document.getElementById('diasSemana').value;

  await sb.from('config').upsert({ key: 'semana_atual', value: semanaText });
  await sb.from('config').upsert({ key: 'dias_semana',  value: `${diaAtual}/${diasSemana}` });

  if (data._deletedActivityIds?.length) {
    await sb.from('activities')
      .delete()
      .in('id', data._deletedActivityIds);
    data._deletedActivityIds = [];
  }

  for (const card of data.cards) {
    const { error: ce } = await sb.from('cards').upsert({
      id:               card.id,
      theme:            card.theme,
      emoji:            card.emoji,
      title:            card.title,
      title_sub:        card.titleSub,
      sub_label:        card.subLabel,
      visible:          card.visible,
      color1:           card.color1,
      color2:           card.color2,
      message:          card.message,
      msg_footer_label: card.msgFooterLabel,
      sort_order:       card.sortOrder || 0,
      updated_at:       new Date().toISOString(),
    });
    if (ce) throw ce;

    for (const act of card.activities) {
      const { error: ae } = await sb.from('activities').upsert({
        id:         act.id,
        card_id:    card.id,
        icon:       act.icon,
        name:       act.name,
        real_val:   act.real,
        meta:       act.meta,
        pct:        act.pct,
        na:         act.na || false,
        is_percent: act.isPercent || false,
        position:   act.position || 0,
        updated_at: new Date().toISOString(),
      });
      if (ae) throw ae;
    }
  }
}

/* ════════════════════════════════════════════
   COMPUTE PCT
════════════════════════════════════════════ */
function calcPct(real, meta) {
  if (!meta || meta === 0) return 0;
  return Math.round((real / meta) * 100);
}

function getWeekProgress() {
  const diaAtual   = parseFloat(document.getElementById('diaAtual')?.value)   || 1;
  const diasSemana = parseFloat(document.getElementById('diasSemana')?.value) || 5;
  return diasSemana > 0 ? (diaAtual / diasSemana) * 100 : 0;
}

function barColor(pct) {
  if (pct >= 100) return '#2ecc40';
  if (pct >= getWeekProgress()) return '#f1c40f';
  return '#e74c3c';
}

/* ════════════════════════════════════════════
   RENDER
════════════════════════════════════════════ */
function applyCardColors(card) {
  const c = document.getElementById(`card-${card.id}`);
  if (!c) return;
  c.querySelectorAll('.card-header, .section-bar').forEach(el => {
    el.style.background = card.color1;
  });
  const banner = document.getElementById(`banner-${card.id}`);
  if (banner) banner.style.background =
    `linear-gradient(135deg, ${card.color1} 0%, ${card.color2} 100%)`;
}

function renderCard(card) {
  const activitiesHTML = card.activities.map((act, i) => {
    let pct = act.pct;
    if (pct === null) {
      if (act.na) pct = 0;
      else pct = calcPct(act.real, act.meta, act.isPercent);
    }
    const color = barColor(pct);
    const displayPct = Math.min(pct, 100);

    const valDisplay = act.na
      ? `<span class="act-pct" style="color:#999">N/A</span>`
      : act.isPercent
        ? `<span class="act-pct" contenteditable="false" data-field="real" data-card="${card.id}" data-act="${i}">${act.real}</span>%`
        : `<span class="act-pct act-vals-view" data-card="${card.id}" data-act="${i}">${act.real} / ${act.meta}</span>
         <span class="act-vals-edit">
           <input class="val-input" type="number" step="any" data-card="${card.id}" data-act="${i}" data-field="real" value="${act.real}"> /
           <input class="val-input" type="number" step="any" data-card="${card.id}" data-act="${i}" data-field="meta" value="${act.meta}">
         </span>`;

    const progressHTML = act.na
      ? `<div class="progress-wrap"><div class="progress-bar" style="width:0%;background:#ccc"></div><span class="progress-label" style="color:#999">N/A</span></div>`
      : `<div class="progress-wrap">
          <div class="progress-bar" style="width:${displayPct}%;background:${color}" id="bar-${card.id}-${i}"></div>
          <span class="progress-label">${displayPct}%</span>
        </div>`;

    return `
    <div class="activity">
      <div class="act-icon" data-card="${card.id}" data-act="${i}"><span class="act-icon-char">${act.icon}</span></div>
      <div class="act-info">
        <span class="act-name" contenteditable="false" data-field="name" data-card="${card.id}" data-act="${i}">${act.name}</span>
        ${progressHTML}
      </div>
      ${valDisplay}
      <button class="act-remove-btn"
        data-card="${card.id}" data-act="${i}"
        title="Remover atividade">×</button>
    </div>`;
  }).join('');

  const totalMeta = card.activities.reduce((s, a) => s + (a.na ? 0 : a.meta), 0);
  const totalReal = card.activities.reduce((s, a) => s + (a.na ? 0 : a.real), 0);
  const avancoAcumulado = totalMeta > 0 ? (totalReal / totalMeta * 100).toFixed(2) : '0.00';

  const metaHTML = `
  <div class="meta-box">
    <div>META SEMANA:</div>
    <div><strong id="total-meta-${card.id}">${totalMeta}</strong></div>
    <div>AVANÇO:</div>
    <div><strong id="total-real-${card.id}">${totalReal}</strong></div>
    <div class="meta-total">AVANÇO ACUMULADO: <strong id="total-acum-${card.id}">${avancoAcumulado}</strong>%</div>
  </div>`;

  const footerLabel = card.msgFooterLabel
    ? `<div class="section-bar" style="background:${card.color1}">${card.msgFooterLabel}</div>`
    : `<div class="section-bar" style="background:${card.color1}">MENSAGEM DA SEMANA</div>`;

  return `
  <div class="card${card.visible === false ? ' card-hidden' : ''}" id="card-${card.id}">
    <label class="visibility-toggle" title="Visível no dashboard">
      <input type="checkbox" class="vis-check" data-card="${card.id}"
        ${card.visible !== false ? 'checked' : ''}>
      <span>Visível</span>
    </label>
    <div class="card-header" style="background:${card.color1}">
      <div class="category">${card.title}</div>
      <div class="avanço-label">AVANÇO SEMANAL</div>
    </div>
    <div class="banner-placeholder" id="banner-${card.id}"
         style="background: linear-gradient(135deg, ${card.color1} 0%, ${card.color2} 100%)">
      ${card.emoji}
      <button class="emoji-btn" data-card="${card.id}">✏️ Emoji</button>
      <div class="emoji-picker-popup" id="emoji-picker-${card.id}">
        ${emojiList.map(e =>
          `<button class="emoji-opt" data-card="${card.id}" data-emoji="${e}">${e}</button>`
        ).join('')}
      </div>
    </div>
    <div class="card-color-row">
      COR 1: <input type="color" class="color1-input" data-card="${card.id}" value="${card.color1}">
      COR 2: <input type="color" class="color2-input" data-card="${card.id}" value="${card.color2}">
    </div>
    <div class="section-bar" style="background:${card.color1}">AVANÇO SEMANAL</div>
    ${card.subLabel ? `<div class="sub-label">${card.subLabel}</div>` : ''}
    <div class="activities">${activitiesHTML}</div>
    <button class="add-activity-btn" data-card="${card.id}">+ Adicionar Atividade</button>
    ${metaHTML}
    ${footerLabel}
    <div class="msg-box">
      <span class="msg-icon">💬</span>
      <span contenteditable="false" data-field="message" data-card="${card.id}">${card.message}</span>
    </div>
  </div>`;
}

function render(data) {
  const grid = document.getElementById('grid');
  grid.innerHTML = data.cards.map(renderCard).join('') +
    `<div class="add-card-ghost" id="addCardGhost">
       <span class="ghost-plus">+</span>
       <span>Novo Card</span>
     </div>`;
  document.getElementById('addCardGhost').addEventListener('click', openNewCardModal);
  attachMetaListeners(data);
  attachValListeners(data);
  attachCardEditListeners(data);
  data.cards.forEach(card => {
    if (!editMode && card.visible === false) {
      const el = document.getElementById(`card-${card.id}`);
      if (el) el.style.display = 'none';
    }
    if (card.visible === false)
      document.getElementById(`card-${card.id}`)?.classList.add('card-hidden');
  });
}

/* ════════════════════════════════════════════
   META INPUT LISTENERS
════════════════════════════════════════════ */
function attachMetaListeners(data) {
  document.querySelectorAll('.meta-input').forEach(input => {
    input.addEventListener('change', () => {
      const cardId = input.dataset.card;
      const field  = input.dataset.field;
      const card   = data.cards.find(c => c.id === cardId);
      if (card) {
        card[field] = parseFloat(input.value) || 0;
        const lbl = document.querySelector(`.meta-lbl[data-card="${cardId}"][data-lbl="${field}"]`);
        if (lbl) lbl.textContent = input.value;
      }
    });
  });
}

/* ════════════════════════════════════════════
   VAL INPUT LISTENERS
════════════════════════════════════════════ */
function attachValListeners(data) {
  document.querySelectorAll('.val-input').forEach(input => {
    input.addEventListener('input', () => {
      const cardId = input.dataset.card;
      const actIdx = parseInt(input.dataset.act);
      const field  = input.dataset.field;
      const card   = data.cards.find(c => c.id === cardId);
      if (!card) return;

      const act = card.activities[actIdx];
      act[field] = parseFloat(input.value) || 0;

      // atualiza span de visualização
      const viewSpan = document.querySelector(`.act-vals-view[data-card="${cardId}"][data-act="${actIdx}"]`);
      if (viewSpan) viewSpan.textContent = `${act.real} / ${act.meta}`;

      // atualiza barra de progresso
      const pct = calcPct(act.real, act.meta);
      const displayPct = Math.min(pct, 100);
      const bar = document.getElementById(`bar-${cardId}-${actIdx}`);
      if (bar) {
        bar.style.width = displayPct + '%';
        bar.style.background = barColor(pct);
        const lbl = bar.parentElement.querySelector('.progress-label');
        if (lbl) lbl.textContent = displayPct + '%';
      }

      // atualiza totais do card
      const totalMeta = card.activities.reduce((s, a) => s + (a.na ? 0 : a.meta), 0);
      const totalReal = card.activities.reduce((s, a) => s + (a.na ? 0 : a.real), 0);
      const metaEl = document.getElementById(`total-meta-${cardId}`);
      const realEl = document.getElementById(`total-real-${cardId}`);
      const acumEl = document.getElementById(`total-acum-${cardId}`);
      if (metaEl) metaEl.textContent = totalMeta;
      if (realEl) realEl.textContent = totalReal;
      if (acumEl) {
        const acum = totalMeta > 0 ? (totalReal / totalMeta * 100).toFixed(2) : '0.00';
        acumEl.textContent = acum;
      }
    });
  });
}

/* ════════════════════════════════════════════
   CARD EDIT LISTENERS
════════════════════════════════════════════ */
function attachCardEditListeners(data) {

  document.querySelectorAll('.vis-check').forEach(chk => {
    chk.addEventListener('change', () => {
      const card = data.cards.find(c => c.id === chk.dataset.card);
      if (!card) return;
      card.visible = chk.checked;
      document.getElementById(`card-${card.id}`)
        ?.classList.toggle('card-hidden', !chk.checked);
    });
  });

  document.querySelectorAll('.color1-input, .color2-input').forEach(inp => {
    inp.addEventListener('input', () => {
      const card = data.cards.find(c => c.id === inp.dataset.card);
      if (!card) return;
      if (inp.classList.contains('color1-input')) card.color1 = inp.value;
      else card.color2 = inp.value;
      applyCardColors(card);
    });
  });

  document.querySelectorAll('.emoji-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const popup = document.getElementById(`emoji-picker-${btn.dataset.card}`);
      document.querySelectorAll('.emoji-picker-popup.open')
        .forEach(p => { if (p !== popup) p.classList.remove('open'); });
      popup?.classList.toggle('open');
    });
  });

  document.querySelectorAll('.emoji-opt').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const card = data.cards.find(c => c.id === btn.dataset.card);
      if (!card) return;
      card.emoji = btn.dataset.emoji;
      const banner = document.getElementById(`banner-${card.id}`);
      if (banner) banner.childNodes[0].textContent = btn.dataset.emoji;
      document.getElementById(`emoji-picker-${card.id}`)?.classList.remove('open');
    });
  });

  document.addEventListener('click', () => {
    document.querySelectorAll('.emoji-picker-popup.open')
      .forEach(p => p.classList.remove('open'));
  });

  const actPopup = document.getElementById('actEmojiPopup');

  document.querySelectorAll('.act-icon[data-act]').forEach(icon => {
    icon.addEventListener('click', e => {
      if (!editMode) return;
      e.stopPropagation();

      const sameTarget = actPopup.dataset.card === icon.dataset.card &&
                         actPopup.dataset.act  === icon.dataset.act &&
                         actPopup.classList.contains('open');
      if (sameTarget) { actPopup.classList.remove('open'); return; }

      actPopup.dataset.card = icon.dataset.card;
      actPopup.dataset.act  = icon.dataset.act;
      actPopup.innerHTML = emojiList.map(em =>
        `<button class="act-emoji-opt" data-card="${icon.dataset.card}" data-act="${icon.dataset.act}" data-emoji="${em}">${em}</button>`
      ).join('');

      actPopup.querySelectorAll('.act-emoji-opt').forEach(btn => {
        btn.addEventListener('click', ev => {
          ev.stopPropagation();
          const card = data.cards.find(c => c.id === btn.dataset.card);
          const idx  = parseInt(btn.dataset.act);
          if (!card) return;
          card.activities[idx].icon = btn.dataset.emoji;
          const span = document.querySelector(`.act-icon[data-card="${btn.dataset.card}"][data-act="${btn.dataset.act}"] .act-icon-char`);
          if (span) span.textContent = btn.dataset.emoji;
          actPopup.classList.remove('open');
        });
      });

      const rect = icon.getBoundingClientRect();
      actPopup.style.top  = (rect.bottom + 4) + 'px';
      actPopup.style.left = rect.left + 'px';
      document.querySelectorAll('.emoji-picker-popup.open')
        .forEach(p => { if (p !== actPopup) p.classList.remove('open'); });
      actPopup.classList.add('open');
    });
  });

  document.querySelectorAll('.act-remove-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const card = data.cards.find(c => c.id === btn.dataset.card);
      const idx  = parseInt(btn.dataset.act);
      if (!card) return;
      const removed = card.activities.splice(idx, 1)[0];
      if (removed?.id) data._deletedActivityIds.push(removed.id);
      render(data);
      if (editMode) setEditMode(true, data);
    });
  });

  document.querySelectorAll('.add-activity-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const card = data.cards.find(c => c.id === btn.dataset.card);
      if (!card) return;
      card.activities.push({
        id:        crypto.randomUUID(),
        icon:      '🔧',
        name:      'NOVA ATIVIDADE',
        real:      0,
        meta:      0,
        pct:       null,
        na:        false,
        isPercent: false,
        position:  card.activities.length,
      });
      render(data);
      if (editMode) setEditMode(true, data);
    });
  });
}

/* ════════════════════════════════════════════
   EDIT MODE TOGGLE
════════════════════════════════════════════ */
let editMode = false;
let emojiList = [];
let newCardEmoji = '🔧';

function slugify(text) {
  return text
    .toLowerCase()
    .normalize('NFD')
    .replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9]+/g, '')
    || 'card';
}

function openNewCardModal() {
  newCardEmoji = '🔧';
  document.getElementById('newCardEmojiBtn').textContent = newCardEmoji;
  document.getElementById('newCardTitle').value = '';
  document.getElementById('newCardColor1').value = '#1a9bb5';
  document.getElementById('newCardColor2').value = '#a8e063';
  document.getElementById('newCardError').textContent = '';
  document.getElementById('newCardModal').classList.add('open');
  document.getElementById('newCardTitle').focus();
}

function closeNewCardModal() {
  document.getElementById('newCardModal').classList.remove('open');
}

function doCreateCard() {
  const titleRaw = document.getElementById('newCardTitle').value.trim();
  const errorEl  = document.getElementById('newCardError');
  if (!titleRaw) { errorEl.textContent = 'Informe um título para o card.'; return; }

  let baseId = slugify(titleRaw);
  let uniqueId = baseId;
  let counter = 2;
  while (appData.cards.find(c => c.id === uniqueId)) {
    uniqueId = baseId + counter++;
  }

  const color1   = document.getElementById('newCardColor1').value;
  const color2   = document.getElementById('newCardColor2').value;
  const maxOrder = appData.cards.reduce((m, c) => Math.max(m, c.sortOrder || 0), 0);

  appData.cards.push({
    id:            uniqueId,
    theme:         'teal',
    emoji:         newCardEmoji,
    title:         titleRaw.toUpperCase(),
    titleSub:      null,
    subLabel:      null,
    visible:       true,
    color1,
    color2,
    message:       '',
    msgFooterLabel: null,
    sortOrder:     maxOrder + 1,
    activities:    [],
  });

  closeNewCardModal();
  render(appData);
  setEditMode(true, appData);
}

function setEditMode(on, data) {
  editMode = on;
  document.body.classList.toggle('edit-mode', on);

  document.querySelectorAll('[contenteditable]').forEach(el => {
    el.contentEditable = on ? 'true' : 'false';
  });

  document.querySelectorAll('.meta-input').forEach(inp => {
    inp.disabled = !on;
  });

  document.getElementById('toggleEdit').textContent = on ? '🔒 Fechar Edição' : '✏️ Editar Dados';

  if (on) {
    data.cards.forEach(card => {
      const el = document.getElementById(`card-${card.id}`);
      if (el) el.style.display = '';
    });
  }

  if (!on) {
    collectEdits(data);
    data.cards.forEach(card => {
      card.activities.forEach((act, i) => {
        if (act.na) return;
        const pct = calcPct(act.real, act.meta, act.isPercent);
        const bar = document.getElementById(`bar-${card.id}-${i}`);
        if (bar) {
          bar.style.width = Math.min(pct, 100) + '%';
          bar.style.background = barColor(pct);
          const lbl = bar.parentElement.querySelector('.progress-label');
          if (lbl) lbl.textContent = Math.min(pct, 100) + '%';
        }
      });
    });
  }
}

function collectEdits(data) {
  document.querySelectorAll('[data-field]').forEach(el => {
    if (el.tagName === 'INPUT') return; // val-inputs já atualizam appData via listener
    const cardId = el.dataset.card;
    const field  = el.dataset.field;
    const actIdx = el.dataset.act;
    const card   = data.cards.find(c => c.id === cardId);
    if (!card) return;

    if (actIdx !== undefined) {
      const act = card.activities[parseInt(actIdx)];
      if (field === 'name') {
        act.name = el.textContent.trim();
      } else if (field === 'real') {
        act.real = parseFloat(el.textContent.trim()) || 0;
      }
    } else {
      if (field === 'message') card.message = el.textContent.trim();
    }
  });
}

/* ════════════════════════════════════════════
   AUTH
════════════════════════════════════════════ */
function setAuthUI(loggedIn) {
  document.getElementById('toggleEdit').style.display = loggedIn ? '' : 'none';
  document.getElementById('saveBtn').style.display    = loggedIn ? '' : 'none';
  document.getElementById('loginBtn').style.display   = loggedIn ? 'none' : '';
  document.getElementById('logoutBtn').style.display  = loggedIn ? '' : 'none';
  if (!loggedIn && editMode) setEditMode(false, appData);
}

function showLoginModal() {
  document.getElementById('loginError').textContent = '';
  document.getElementById('loginModal').classList.add('open');
  document.getElementById('loginEmail').focus();
}

function hideLoginModal() {
  document.getElementById('loginModal').classList.remove('open');
  document.getElementById('loginEmail').value = '';
  document.getElementById('loginPassword').value = '';
}

async function doLogin() {
  const email     = document.getElementById('loginEmail').value.trim();
  const password  = document.getElementById('loginPassword').value;
  const errorEl   = document.getElementById('loginError');
  const submitBtn = document.getElementById('loginSubmit');

  errorEl.textContent = '';
  submitBtn.disabled = true;
  submitBtn.textContent = 'Entrando...';

  const { error } = await sb.auth.signInWithPassword({ email, password });

  submitBtn.disabled = false;
  submitBtn.textContent = 'Entrar';

  if (error) {
    errorEl.textContent = 'Email ou senha incorretos.';
  } else {
    hideLoginModal();
  }
}

function setupAuthListener() {
  sb.auth.onAuthStateChange((_event, session) => {
    setAuthUI(!!session);
  });
}

/* ════════════════════════════════════════════
   INIT
════════════════════════════════════════════ */
let appData = null;

/* ════════════════════════════════════════════
   EVENT LISTENERS
════════════════════════════════════════════ */
document.getElementById('toggleEdit').addEventListener('click', () => {
  setEditMode(!editMode, appData);
});

document.getElementById('saveBtn').addEventListener('click', async () => {
  if (editMode) { collectEdits(appData); setEditMode(false, appData); }
  const btn = document.getElementById('saveBtn');
  btn.textContent = '⏳ Salvando...';
  btn.disabled = true;
  try {
    await saveData(appData);
    btn.textContent = '✅ Salvo!';
  } catch (err) {
    btn.textContent = '❌ Erro ao salvar!';
    console.error(err);
  }
  setTimeout(() => { btn.textContent = '💾 Salvar'; btn.disabled = false; }, 2500);
});

document.getElementById('newCardSubmit').addEventListener('click', doCreateCard);
document.getElementById('newCardCancel').addEventListener('click', closeNewCardModal);
document.getElementById('newCardTitle').addEventListener('keydown', e => {
  if (e.key === 'Enter') doCreateCard();
});
document.getElementById('newCardModal').addEventListener('click', e => {
  if (e.target === document.getElementById('newCardModal')) closeNewCardModal();
});
document.getElementById('newCardEmojiBtn').addEventListener('click', e => {
  e.stopPropagation();
  const actPopup = document.getElementById('actEmojiPopup');
  actPopup.innerHTML = emojiList.map(em =>
    `<button class="act-emoji-opt" data-newcard="1" data-emoji="${em}">${em}</button>`
  ).join('');
  actPopup.querySelectorAll('.act-emoji-opt[data-newcard]').forEach(btn => {
    btn.addEventListener('click', ev => {
      ev.stopPropagation();
      newCardEmoji = btn.dataset.emoji;
      document.getElementById('newCardEmojiBtn').textContent = newCardEmoji;
      actPopup.classList.remove('open');
    });
  });
  const rect = e.target.getBoundingClientRect();
  actPopup.style.top  = (rect.bottom + 4) + 'px';
  actPopup.style.left = rect.left + 'px';
  document.querySelectorAll('.emoji-picker-popup.open')
    .forEach(p => { if (p !== actPopup) p.classList.remove('open'); });
  actPopup.classList.add('open');
});

document.getElementById('loginBtn').addEventListener('click', showLoginModal);
document.getElementById('loginCancel').addEventListener('click', hideLoginModal);
document.getElementById('loginSubmit').addEventListener('click', doLogin);
document.getElementById('logoutBtn').addEventListener('click', () => sb.auth.signOut());

document.getElementById('loginPassword').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});

document.getElementById('loginModal').addEventListener('click', e => {
  if (e.target === document.getElementById('loginModal')) hideLoginModal();
});

document.getElementById('pdfBtn').addEventListener('click', async () => {
  const btn = document.getElementById('pdfBtn');
  btn.textContent = '⏳ Gerando...';
  btn.disabled = true;

  const toolbar = document.querySelector('.toolbar');
  toolbar.style.display = 'none';

  try {
    await html2pdf()
      .set({
        margin: 8,
        filename: 'avanco-semanal.pdf',
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true, logging: false },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' }
      })
      .from(document.getElementById('pdf-content'))
      .save();
  } finally {
    toolbar.style.display = '';
    btn.textContent = '📄 Gerar PDF';
    btn.disabled = false;
  }
});
